name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to build
        type: choice
        options: [all, pocket-ecosystem, dominion-of-ash, crown-of-thorns]
        default: all
      signed:
        description: Sign with the certificate in repo secrets (needs IOS_* secrets)
        type: boolean
        default: false
  workflow_call:
    inputs:
      game: { type: string, default: all }
      signed: { type: boolean, default: false }
      version: { type: string, default: '' }
  push:
    branches: [main]
    paths:
      - 'pocket-ecosystem/**'
      - 'dominion-of-ash/**'
      - 'crown-of-thorns/**'
      - 'shared-assets/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.game || 'push' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        env:
          INPUT: ${{ inputs.game }}
          BEFORE: ${{ github.event.before }}
        run: |
          set +e
          ALL=""; for d in */; do d=${d%/}; if [ -d "$d/ios" ]; then ALL="$ALL $d"; fi; done
          if [ -n "$INPUT" ] && [ "$INPUT" != "all" ]; then SEL="$INPUT"
          elif [ -n "$INPUT" ]; then SEL="$ALL"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null)
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(shared-assets/|\.github/)'; then SEL="$ALL"
            else SEL=""; for d in $ALL; do if echo "$CHANGED" | grep -q "^$d/"; then SEL="$SEL $d"; fi; done; fi
          fi
          JSON=$(for d in $SEL; do echo "$d"; done | jq -R . | jq -cs .)
          echo "games=$JSON" >> "$GITHUB_OUTPUT"; echo "Building: $JSON"

  test:
    needs: plan
    if: needs.plan.outputs.games != '[]'
    strategy: { fail-fast: false, matrix: { game: '${{ fromJSON(needs.plan.outputs.games) }}' } }
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: '${{ matrix.game }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ matrix.game }}/package-lock.json' }
      - run: npm ci
      - name: Headless game tests
        run: npm test
      - run: npm run build

  ios:
    needs: [plan, test]
    strategy: { fail-fast: false, matrix: { game: '${{ fromJSON(needs.plan.outputs.games) }}' } }
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GAME: ${{ matrix.game }}
      SIGN: ${{ inputs.signed && 'true' || 'false' }}
    defaults: { run: { working-directory: '${{ matrix.game }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '${{ matrix.game }}/package-lock.json' }
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: npm ci
      - name: Build web bundle and sync into the iOS project
        run: |
          npm run build
          npx cap sync ios
      - name: Stamp build number
        run: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" App.xcodeproj/project.pbxproj
          V="${VERSION#v}"
          if echo "$V" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $V;/g" App.xcodeproj/project.pbxproj
            echo "Version $V"
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Archive (unsigned)
        if: env.SIGN != 'true'
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -40
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$GAME-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/$GAME-unsigned.ipa"

      - name: Install signing certificate and profile
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive and export (signed)
        if: env.SIGN == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: |
          cd ios/App
          BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' App.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/$GAME.ipa"

      - name: Upload to TestFlight
        if: env.SIGN == 'true' && vars.UPLOAD_TESTFLIGHT == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f "$GITHUB_WORKSPACE/$GAME.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME }}-ipa-${{ github.run_number }}
          path: '*.ipa'
          if-no-files-found: error
          retention-days: 30
